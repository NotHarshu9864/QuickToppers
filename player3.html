<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quick Player - Harsh</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            -webkit-user-select: none;
            user-select: none;
        }

        /* Gradient Theme */
        .gradient-bg {
            background: linear-gradient(135deg, #0a0a0a 0%, #111827 40%, #1e1b4b 100%);
        }

        /* Loading bar */
        .loading-bar {
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #00eaff, #9b5eff);
            background-size: 200% 100%;
            animation: loading 1.2s linear infinite;
        }

        @keyframes loading {
            0% { background-position: 0% 0; }
            100% { background-position: -200% 0; }
        }

        /* Fullscreen hide other UI */
        .hidden-ui {
            display: none !important;
        }
    </style>
</head>

<body class="gradient-bg text-white min-h-screen">

    <script>
        document.addEventListener("contextmenu", e => e.preventDefault()); // disable right click
    </script>

    <!-- HEADER -->
    <header id="headerUI" class="w-full bg-gray-900/40 backdrop-blur-md px-4 py-3 shadow-lg sticky top-0 z-50">
        <h1 class="text-xl font-bold tracking-wide">Quick Player</h1>
    </header>

    <!-- Loading animation -->
    <div id="loadingBar" class="loading-bar"></div>

    <!-- MAIN LAYOUT -->
    <div class="max-w-7xl mx-auto px-4 mt-4 grid grid-cols-1 lg:grid-cols-3 gap-4">

        <!-- PLAYER -->
        <div id="playerSection" class="lg:col-span-2 transition-all">

            <div class="w-full aspect-video rounded-2xl bg-black overflow-hidden shadow-2xl border border-gray-700">
                <iframe
                    id="player"
                    class="w-full h-full"
                    src=""
                    allow="autoplay; encrypted-media; fullscreen; picture-in-picture; *"
                    allowfullscreen
                    webkitallowfullscreen
                    mozallowfullscreen
                    frameborder="0">
                </iframe>
            </div>

            <h2 class="text-2xl font-semibold mt-4">Quick Player</h2>
            <p class="text-gray-300">Free Batch Streaming Platform</p>
        </div>

        <!-- PLAYLIST -->
        <div id="playlistSection"
            class="bg-gray-900/40 backdrop-blur-md rounded-xl border border-gray-700 shadow-xl p-4 h-[70vh] overflow-y-auto">
            <h3 class="text-lg mb-3 font-semibold">More Batches</h3>

            <div id="playlist" class="space-y-3"></div>
        </div>

    </div>

    <script>
        /* ---------------------------
           1️⃣ Load video list from JSON
        ----------------------------- */
        async function loadEpisodes() {
            const res = await fetch("episodes.json");
            const data = await res.json();

            const playlist = document.getElementById("playlist");

            data.forEach((ep, index) => {
                const item = document.createElement("div");
                item.className =
                    "p-3 bg-gray-800/60 hover:bg-gray-700 cursor-pointer rounded-xl transition border border-gray-700";
                item.innerText = ep.title;

                item.onclick = () => loadVideo(ep.src, item);
                playlist.appendChild(item);

                if (index === 0) loadVideo(ep.src, item); // auto load first episode
            });
        }

        /* ---------------------------
           2️⃣ Load video in player
        ----------------------------- */
        function loadVideo(src, element) {
            document.getElementById("player").src =
                `https://hlsplayer.net/embed?type=m3u8&src=${encodeURIComponent(src)}`;

            document.querySelectorAll("#playlist div").forEach(item =>
                item.classList.remove("bg-cyan-600")
            );

            element.classList.add("bg-cyan-600");
        }

        loadEpisodes();

        /* ---------------------------
           3️⃣ Hide UI during Fullscreen
        ----------------------------- */
        document.addEventListener("fullscreenchange", () => {
            const isFS = !!document.fullscreenElement;

            const header = document.getElementById("headerUI");
            const sidebar = document.getElementById("playlistSection");
            const loading = document.getElementById("loadingBar");

            if (isFS) {
                header.classList.add("hidden-ui");
                sidebar.classList.add("hidden-ui");
                loading.classList.add("hidden-ui");

                // force landscape on fullscreen
                if (screen.orientation.lock) {
                    screen.orientation.lock("landscape").catch(() => {});
                }

            } else {
                header.classList.remove("hidden-ui");
                sidebar.classList.remove("hidden-ui");
                loading.classList.remove("hidden-ui");
            }
        });

        /* ---------------------------
           4️⃣ Hide loading bar on iframe load
        ----------------------------- */
        document.getElementById("player").addEventListener("load", () => {
            document.getElementById("loadingBar").style.display = "none";
        });
    </script>

</body>

  </html>
