<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Media Vault</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
    background:#03040a;
    color:white;
    font-family:Inter,sans-serif;
}

.glass{
    background:rgba(20,20,25,.65);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.08);
}

.card{
    transition:.3s;
    cursor:pointer;
}

.card:hover{
    transform:translateY(-4px);
    border-color:rgba(251,191,36,.4);
}

#loader{
    display:none;
    position:fixed;
    inset:0;
    background:#03040a;
    z-index:9999;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

.spinner{
    width:60px;
    height:60px;
    border:4px solid #333;
    border-top:4px solid #fbbf24;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:10000;
}
</style>
</head>

<body>

<!-- Background -->
<div class="fixed top-0 left-0 w-72 h-72 bg-amber-500/10 rounded-full blur-[120px]"></div>
<div class="fixed bottom-0 right-0 w-72 h-72 bg-blue-500/10 rounded-full blur-[120px]"></div>

<!-- Loader -->
<div id="loader">
    <div class="spinner"></div>
    <p class="mt-4 text-stone-300">Opening Media...</p>
</div>

<!-- Passcode Popup -->
<div id="codeModal" class="modal">
    <div class="glass p-6 rounded-2xl w-[90%] max-w-sm">
        <h2 class="text-xl font-bold mb-2">Access Required</h2>

        <p class="text-gray-400 text-sm mb-4">
            Enter the 6-digit code
        </p>

        <input
            id="accessCode"
            type="password"
            maxlength="6"
            placeholder="******"
            class="w-full bg-black border border-gray-700 rounded-xl px-4 py-3 outline-none"
        >

        <p id="errorMsg" class="text-red-400 text-sm mt-2 hidden">
            Incorrect code
        </p>

        <div class="flex gap-2 mt-4">
            <button
                onclick="closePopup()"
                class="flex-1 bg-gray-800 py-3 rounded-xl">
                Cancel
            </button>

            <button
                onclick="verifyCode()"
                class="flex-1 bg-amber-500 text-black font-bold py-3 rounded-xl">
                Continue
            </button>
        </div>
    </div>
</div>

<div class="max-w-6xl mx-auto px-4 py-10">

    <h1 class="text-center text-5xl font-black mb-2">
        Media <span class="text-amber-400">Vault</span>
    </h1>

    <p class="text-center text-gray-400 mb-8">
        Secure Media Collection
    </p>

    <!-- Search -->
    <div class="max-w-md mx-auto mb-8">
        <input
            id="search"
            type="text"
            placeholder="Search media..."
            onkeyup="searchCards()"
            class="w-full bg-black border border-gray-800 rounded-xl px-4 py-3"
        >
    </div>

    <!-- Gallery -->
    <div id="gallery" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">

        <div class="card glass rounded-2xl overflow-hidden"
             onclick="showCodePopup('https://example.com/image1.jpg')">

            <img src="https://picsum.photos/600/350?1"
                 class="w-full h-48 object-cover">

            <div class="p-4">
                <h3 class="font-bold">Photo 1</h3>
                <p class="text-sm text-gray-400">Thumbnail Preview</p>
            </div>
        </div>

        <div class="card glass rounded-2xl overflow-hidden"
             onclick="showCodePopup('https://example.com/image2.jpg')">

            <img src="https://picsum.photos/600/350?2"
                 class="w-full h-48 object-cover">

            <div class="p-4">
                <h3 class="font-bold">Photo 2</h3>
                <p class="text-sm text-gray-400">Thumbnail Preview</p>
            </div>
        </div>

        <div class="card glass rounded-2xl overflow-hidden"
             onclick="showCodePopup('https://example.com/image3.jpg')">

            <img src="https://picsum.photos/600/350?3"
                 class="w-full h-48 object-cover">

            <div class="p-4">
                <h3 class="font-bold">Photo 3</h3>
                <p class="text-sm text-gray-400">Thumbnail Preview</p>
            </div>
        </div>

    </div>

</div>

<script>

const ACCESS_CODE = "090807";
let targetUrl = "";

// popup
function showCodePopup(url){
    targetUrl = url;
    document.getElementById("codeModal").style.display = "flex";
    document.getElementById("accessCode").value = "";
    document.getElementById("errorMsg").classList.add("hidden");
}

function closePopup(){
    document.getElementById("codeModal").style.display = "none";
}

function verifyCode(){

    const code = document.getElementById("accessCode").value;

    if(code === ACCESS_CODE){

        closePopup();

        document.getElementById("loader").style.display = "flex";

        setTimeout(()=>{
            window.location.href = targetUrl;
        },1500);

    }else{
        document.getElementById("errorMsg").classList.remove("hidden");
    }
}

// search
function searchCards(){

    let input =
        document.getElementById("search")
        .value.toLowerCase();

    let cards =
        document.querySelectorAll(".card");

    cards.forEach(card=>{

        let text =
            card.innerText.toLowerCase();

        card.style.display =
            text.includes(input)
            ? "block"
            : "none";

    });

}

</script>

</body>
        </html>
