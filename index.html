<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Redirecting — QuickToppers</title>

  <!-- Styles: dark + cyan theme, advanced UI -->
  <style>
    :root{
      --bg:#071021;
      --card:#071426;
      --muted:rgba(255,255,255,0.06);
      --cyan-100:#7ef3ff;
      --cyan-200:#00e5ff;
      --glass: rgba(255,255,255,0.04);
      --accent: linear-gradient(135deg,var(--cyan-200),#24ffd8 70%);
      --shadow: 0 10px 30px rgba(2,10,20,0.6);
      --radius:18px;
      --speed:800ms;
      font-synthesis: none;
    }

    /* Reset & layout */
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: radial-gradient(1200px 600px at 10% 10%, rgba(0,230,255,0.03), transparent 10%),
                  radial-gradient(800px 400px at 90% 90%, rgba(6,20,40,0.6), transparent 20%),
                  var(--bg);
      color:#d9f7fb;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px;
    }

    .container{
      width:980px;
      max-width:98%;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:calc(var(--radius) + 6px);
      box-shadow: var(--shadow);
      padding:32px;
      display:flex;
      gap:28px;
      align-items:center;
      justify-content:space-between;
      border:1px solid rgba(255,255,255,0.03);
      position:relative;
      overflow:hidden;
      backdrop-filter: blur(8px) saturate(120%);
    }

    /* Decorative glow */
    .container::before{
      content:"";
      position:absolute;
      left:-20%;
      top:-50%;
      width:600px;height:600px;
      background: radial-gradient(circle at 30% 30%, rgba(0,229,255,0.08), transparent 20%),
                  conic-gradient(from 180deg at 50% 50%, rgba(0,230,255,0.02), transparent 60%);
      transform: rotate(20deg);
      pointer-events:none;
      filter: blur(36px) saturate(150%);
    }

    .left {
      display:flex;
      flex-direction:column;
      gap:12px;
      align-items:flex-start;
    }

    .brand {
      display:flex;
      gap:12px;
      align-items:center;
    }

    .logo {
      width:64px;height:64px;
      border-radius:12px;
      background: linear-gradient(135deg,#00263b,var(--cyan-200));
      display:grid;
      place-items:center;
      box-shadow: 0 8px 30px rgba(0,230,255,0.06), inset 0 -6px 18px rgba(0,0,0,0.35);
      border:1px solid rgba(255,255,255,0.04);
      transform:translateZ(0);
    }

    .logo svg{filter: drop-shadow(0 6px 18px rgba(0,230,255,0.08))}

    .title {
      font-weight:700;
      letter-spacing: -0.02em;
      font-size:20px;
      line-height:1;
    }

    .subtitle {
      font-size:13px;
      color:rgba(255,255,255,0.6);
      margin-top:2px;
    }

    /* Countdown card */
    .countdown-card{
      margin-top:6px;
      background: linear-gradient(180deg, rgba(0,0,0,0.18), rgba(255,255,255,0.02));
      border-radius:14px;
      padding:18px;
      min-width:360px;
      display:flex;
      gap:16px;
      align-items:center;
      box-shadow: 0 10px 26px rgba(2,8,15,0.6);
      border:1px solid rgba(255,255,255,0.03);
    }

    .circle {
      --size:96px;
      width:var(--size);
      height:var(--size);
      border-radius:50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      display:grid;
      place-items:center;
      position:relative;
      box-shadow: inset 0 -8px 18px rgba(0,0,0,0.6);
      overflow: visible;
    }

    /* Animated ring */
    .ring {
      position:absolute;
      inset: -8px;
      border-radius:50%;
      background: conic-gradient(var(--cyan-200), #62f1e8, rgba(0,0,0,0));
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), black calc(100% - 5px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 6px), black calc(100% - 5px));
      transform: rotate(-90deg);
      animation:spin linear var(--duration, 3s) infinite;
      filter: blur(8px) saturate(120%);
      opacity:0.95;
    }

    @keyframes spin{
      from{transform: rotate(-90deg)}
      to{transform: rotate(270deg)}
    }

    .count {
      font-size:28px;
      font-weight:800;
      letter-spacing:-0.02em;
      color: #eaffff;
      text-shadow: 0 8px 30px rgba(0,230,255,0.06);
    }

    .count-small {
      font-size:12px;
      color:rgba(255,255,255,0.55);
      margin-top:4px;
    }

    .right-side{
      flex:1;
      display:flex;
      flex-direction:column;
      gap:12px;
      align-items:flex-end;
    }

    /* Progress bar */
    .progress-wrap{
      width:100%;
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:flex-end;
    }

    .progress-track{
      width:100%;
      height:14px;
      background: linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:20px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,0.03);
    }

    .progress-bar{
      height:100%;
      width:0%;
      border-radius:20px;
      background:var(--accent);
      box-shadow: 0 6px 22px rgba(2,230,230,0.06);
      transition: width linear var(--speed);
    }

    .meta {
      display:flex;
      gap:12px;
      align-items:center;
      font-size:13px;
      color:rgba(255,255,255,0.65);
    }

    /* Animated dots */
    .dots{
      display:inline-grid;
      grid-auto-flow:column;
      gap:6px;
      align-items:center;
    }
    .dot{
      width:8px;height:8px;border-radius:999px;background:rgba(255,255,255,0.08);
      transform-origin:center;
      animation:dot 1s infinite;
    }
    .dot:nth-child(1){animation-delay:0s}
    .dot:nth-child(2){animation-delay:0.15s}
    .dot:nth-child(3){animation-delay:0.3s}
    @keyframes dot{
      0%{transform:translateY(0);opacity:0.35}
      50%{transform:translateY(-6px);opacity:1}
      100%{transform:translateY(0);opacity:0.35}
    }

    /* Small help text */
    .hint{
      font-size:12px;
      color:rgba(255,255,255,0.45);
      margin-top:6px;
      align-self:flex-start;
    }

    /* Footer controls */
    .controls{
      display:flex;
      gap:10px;
      align-items:center;
    }

    .btn{
      border:0;
      background:transparent;
      color:var(--cyan-100);
      padding:8px 12px;
      font-weight:700;
      border-radius:10px;
      cursor:pointer;
      transition: transform 140ms ease, background 140ms ease;
      outline: none;
    }
    .btn:active{ transform: translateY(1px) }
    .btn.ghost{
      border:1px solid rgba(255,255,255,0.04);
      color:rgba(255,255,255,0.85);
      background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
    }

    /* Responsive */
    @media (max-width:720px){
      .container{flex-direction:column;align-items:center;padding:20px}
      .countdown-card{min-width:unset;width:100%;flex-direction:row;align-items:center}
      .right-side{align-items:center}
      .left{align-items:center;text-align:center}
    }

    /* accessibility focus */
    .btn:focus{box-shadow:0 0 0 4px rgba(0,230,255,0.12);border-radius:8px}
  </style>
</head>
<body>
  <main class="container" role="main" aria-labelledby="pageTitle">
    <div class="left" aria-hidden="false">
      <div class="brand" >
        <div class="logo" aria-hidden="true">
          <!-- simple icon -->
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 12c0-5 4-9 9-9s9 4 9 9-4 9-9 9S3 17 3 12z" fill="url(#g)"/>
            <path d="M7 12l4 4 6-8" stroke="#012b36" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <defs>
              <linearGradient id="g" x1="0" x2="1">
                <stop offset="0" stop-color="#00263b"/>
                <stop offset="1" stop-color="#00e5ff"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div>
          <div id="pageTitle" class="title">QuickToppers — Redirect</div>
          <div class="subtitle">You are being sent to the destination securely</div>
        </div>
      </div>

      <div class="countdown-card" role="region" aria-label="Redirect countdown">
        <div class="circle" aria-hidden="false">
          <div class="ring" id="ring" style="--duration:3s"></div>
          <div style="text-align:center; z-index:2">
            <div id="count" class="count" aria-live="polite">3</div>
            <div class="count-small">Redirect</div>
          </div>
        </div>

        <div style="flex:1">
          <div class="progress-wrap" aria-hidden="false">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
              <div style="font-weight:700">Preparing redirect</div>
              <div class="meta"><span id="timeLabel">3s</span><span class="dots" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span></div>
            </div>

            <div class="progress-track" aria-hidden="true">
              <div id="progress" class="progress-bar" style="--speed:800ms"></div>
            </div>

            <div class="hint">If the redirect doesn't happen automatically, you can click <button id="goBtn" class="btn ghost" title="Go now">Go now</button></div>
          </div>
        </div>
      </div>

    </div>

    <div class="right-side" aria-hidden="false">
      <div style="text-align:right; max-width:300px">
        <div style="font-size:14px;font-weight:700">Secure redirect</div>
        <div class="subtitle" style="margin-top:8px">
          We'll route you through a safe endpoint — checking connection & loading optimizations.
        </div>
        <div style="height:8px"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end" class="controls">
          <button id="cancelBtn" class="btn" title="Cancel redirect">Cancel</button>
          <button id="openBtn" class="btn" title="Open now">Open destination</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Script: countdown, progress, redirect -->
  <script>
    (function(){
      // Config
      const targetURL = "https://rolexcoderz.in/";
      const startSeconds = 3; // 3..2..1
      const fps = 60;

      // DOM
      const countEl = document.getElementById('count');
      const progressEl = document.getElementById('progress');
      const ringEl = document.getElementById('ring');
      const timeLabel = document.getElementById('timeLabel');
      const goBtn = document.getElementById('goBtn');
      const cancelBtn = document.getElementById('cancelBtn');
      const openBtn = document.getElementById('openBtn');

      // state
      let secondsLeft = startSeconds;
      let running = true;
      let startTime = performance.now();
      let duration = startSeconds * 1000;
      ringEl.style.setProperty('--duration', (duration/1000) + 's');

      // update visual every frame for smooth progress
      function tick(now){
        if(!running) return;
        const elapsed = Math.min(now - startTime, duration);
        const pct = elapsed / duration;
        // progress width
        progressEl.style.width = (pct * 100) + '%';
        // time left (rounded to nearest second for label)
        const msLeft = Math.max(duration - elapsed, 0);
        const secLeft = Math.ceil(msLeft / 1000);
        timeLabel.textContent = secLeft + 's';

        // circle ring animation uses CSS rotation but we also update the numeric display when a new second boundary passes
        const newSecondsLeft = Math.ceil(msLeft / 1000);
        if(newSecondsLeft !== secondsLeft){
          secondsLeft = newSecondsLeft;
          // animate the number
          animateCount(secondsLeft);
        }

        if(elapsed >= duration){
          // finish
          finishRedirect();
          return;
        }
        requestAnimationFrame(tick);
      }

      // small popping animation for number when it changes
      function animateCount(value){
        // clamp to minimum 0
        const display = Math.max(0, value);
        countEl.textContent = display;
        countEl.style.transition = 'transform 160ms cubic-bezier(.2,.9,.2,1), opacity 140ms';
        countEl.style.transform = 'translateY(-8px) scale(1.05)';
        countEl.style.opacity = '0.98';
        setTimeout(()=> {
          countEl.style.transform = 'translateY(0) scale(1)';
          countEl.style.opacity = '1';
        }, 120);
      }

      // start animation loop
      requestAnimationFrame(tick);

      // finish: navigate (uses location.replace so back button won't loop)
      function finishRedirect(){
        running = false;
        // final UI state
        progressEl.style.width = '100%';
        countEl.textContent = '0';
        timeLabel.textContent = '0s';
        // small flash
        document.body.animate([
          {filter: 'brightness(1)'},
          {filter: 'brightness(1.06)'},
          {filter: 'brightness(1)'}
        ], {duration: 420, easing: 'ease-out'});

        // Redirect
        try {
          // use replace to avoid leaving a redirect page in history
          window.location.replace(targetURL);
        } catch (err) {
          // As fallback open in same tab
          window.location.href = targetURL;
        }
      }

      // buttons
      goBtn.addEventListener('click', function(e){
        e.preventDefault();
        finishRedirect();
      });

      openBtn.addEventListener('click', function(e){
        e.preventDefault();
        window.open(targetURL, '_blank', 'noopener');
      });

      cancelBtn.addEventListener('click', function(e){
        e.preventDefault();
        // stop redirect
        running = false;
        // update UI to show cancelled
        countEl.textContent = '-';
        timeLabel.textContent = 'stopped';
        progressEl.style.transition = 'width 240ms ease';
        progressEl.style.width = '0%';
        // show muted message
        const hint = document.querySelector('.hint');
        hint.textContent = 'Redirect cancelled. You can open destination manually.';
      });

      // Accessibility: allow space or enter to "Go now"
      goBtn.addEventListener('keydown', (ev) => {
        if(ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); goBtn.click(); }
      });

      // Prevent accidental selection double-click
      document.addEventListener('dragstart', e => e.preventDefault());

      // In case page is hidden and animation stops, handle visibilitychange to resume/end
      document.addEventListener('visibilitychange', () => {
        if(document.visibilityState === 'visible' && running){
          // adjust startTime so timing is continuous
          // compute elapsed so far from progress width
          const computedWidth = parseFloat(getComputedStyle(progressEl).width) || 0;
          const trackWidth = progressEl.parentElement.clientWidth || 1;
          const pct = Math.min(1, computedWidth / trackWidth);
          startTime = performance.now() - pct * duration;
          requestAnimationFrame(tick);
        }
      });
    })();
  </script>
</body>
</html>
