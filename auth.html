<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Face Auth</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- face-api CDN -->
  <script defer src="https://unpkg.com/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 20px;
      text-align: center;
    }
    video {
      width: 100%;
      max-width: 320px;
      border-radius: 10px;
      background: #000;
      margin: 10px 0;
    }
    button {
      padding: 10px 15px;
      margin: 5px;
      font-size: 15px;
      cursor: pointer;
    }
    #status {
      margin-top: 15px;
      font-weight: bold;
    }
    #success {
      display: none;
      color: green;
      font-size: 20px;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <h2>Face Authentication</h2>

  <video id="video" autoplay muted playsinline></video>

  <div>
    <button id="startCam">Start Camera</button>
    <button id="registerBtn">Register Face</button>
    <button id="loginBtn">Login</button>
  </div>

  <div id="status">Waiting...</div>
  <div id="success">✅ Authentication Successful</div>

  <script type="module">
    import { startCamera } from "./js/camera.js";
    import { loadModels } from "./js/faceEngine.js";
    import { register, authenticate } from "./js/auth.js";

    const video = document.getElementById("video");
    const statusEl = document.getElementById("status");
    const successEl = document.getElementById("success");

    await loadModels();
    statusEl.textContent = "Models loaded. Click Start Camera.";

    document.getElementById("startCam").onclick = async () => {
      try {
        await startCamera(video);
        statusEl.textContent = "Camera started";
      } catch (e) {
        statusEl.textContent = e.message;
      }
    };

    document.getElementById("registerBtn").onclick = async () => {
      statusEl.textContent = "Registering face...";
      try {
        await register(video);
        statusEl.textContent = "Face registered successfully";
      } catch (e) {
        statusEl.textContent = e.message;
      }
    };

    document.getElementById("loginBtn").onclick = async () => {
      statusEl.textContent = "Authenticating...";
      successEl.style.display = "none";

      try {
        const ok = await authenticate(video);
        if (ok) {
          statusEl.textContent = "";
          successEl.style.display = "block";
        } else {
          statusEl.textContent = "❌ Face not matched";
        }
      } catch (e) {
        statusEl.textContent = e.message;
      }
    };
  </script>
</body>
</html>
